<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    
    <!-- Outer Ring Gradient (Calories Progress) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- Orange -->
      <stop offset="50%" stop-color="#ef4444" /> <!-- Red -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" /> <!-- Red -->
      <stop offset="60%" stop-color="#f97316" /> <!-- Orange -->
      <stop offset="100%" stop-color="#eab308" /> <!-- Yellow -->
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Rect App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring representing track / progress -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" opacity="0.9" filter="url(#glow)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#27272a" stroke-width="24" opacity="0.3" />

  <!-- Stylized Flame (AI Energy) in Center -->
  <path d="M256 120 
           C285 180, 340 200, 340 270 
           C340 330, 298 370, 256 370 
           C214 370, 172 330, 172 270 
           C172 200, 227 180, 256 120 Z" 
        fill="url(#flameGrad)" 
        filter="url(#glow)" />
  
  <!-- Inner Flame Accent -->
  <path d="M256 180 
           C270 220, 305 235, 305 275 
           C305 315, 280 340, 256 340 
           C232 340, 207 315, 207 275 
           C207 235, 242 220, 256 180 Z" 
        fill="#ffffff" 
        opacity="0.25" />
</svg>
