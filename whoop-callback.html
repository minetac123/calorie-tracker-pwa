<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHOOP - Připojení...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Připojování WHOOP...</p>
    <p id="status" style="font-size: 14px; color: #999; margin-top: 20px;">Zpracovávám...</p>
  </div>

  <script>
    async function handleCallback() {
      try {
        // Get authorization code from URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');

        if (!code) {
          document.getElementById('status').textContent = 'Chyba: Nebyl vrácen autorizační kód';
          return;
        }

        // Get session token from localStorage (must be set before redirect)
        const sessionToken = localStorage.getItem('_fitai_session_token');
        if (!sessionToken) {
          document.getElementById('status').textContent = 'Chyba: Session nebyla nalezena. Zkuste se znovu přihlásit.';
          return;
        }

        // Exchange code for WHOOP access token
        const response = await fetch('/api/whoop', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${sessionToken}`
          },
          body: JSON.stringify({ code: code })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('status').textContent = '✓ Úspěšně připojeno! Přesměrování...';
          setTimeout(() => {
            // Redirect back to settings page
            window.location.href = '/?screen=settings';
          }, 1500);
        } else {
          document.getElementById('status').textContent = `Chyba: ${data.error || 'Nepodařilo se připojit'}`;
        }
      } catch (error) {
        console.error('WHOOP callback error:', error);
        document.getElementById('status').textContent = `Chyba: ${error.message}`;
      }
    }

    handleCallback();
  </script>
</body>
</html>
