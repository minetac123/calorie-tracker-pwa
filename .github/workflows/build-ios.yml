name: Build unsigned iOS IPA

# Vyrobí NEPODEPSANOU .ipa ke stažení jako artifact. Podepisuje se až lokálně
# přes Sideloadly volným Apple ID — proto se tu code signing celý vypíná
# (bez placeného Developer účtu není čím podepsat a build by spadl).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    # Potřeba na vytvoření GitHub Release. Bez toho `gh release create` spadne
    # na 403 až úplně na konci, po proběhlém buildu.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capacitor 8 CLI odmítne cokoliv pod Node 22 ("requires NodeJS >=22.0.0")
      # a build spadne až na `cap sync`, ne na instalaci — takže verzi nesnižuj.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` vyžaduje package-lock.json v souladu s package.json. Když se
      # rozejdou, spadne to tady s jasnou hláškou místo záhadné chyby dál.
      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync to iOS
        run: |
          npm run build
          npx cap sync ios

      # Verze appky má jediný zdroj pravdy: APP_VERSION v api/_lib/version.js.
      # Odsud se plní MARKETING_VERSION (= CFBundleShortVersionString), proti
      # kterému UpdateChecker porovnává tag releasu. Kdyby se rozešly, appka
      # by buď hlásila aktualizaci pořád, nebo nikdy.
      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          # Verze se drží ručně na třech místech. Když se rozejdou, appka by
          # hlásila aktualizaci pořád nebo nikdy — radši shodit build tady.
          node scripts/check-version-sync.js
          APP_VERSION=$(node -p "require('./api/_lib/version.js').APP_VERSION")
          if [ -z "$APP_VERSION" ]; then
            echo "APP_VERSION se nepodařilo přečíst z api/_lib/version.js"
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Verze pro tenhle build: $APP_VERSION"

      - name: Show Xcode version
        run: xcodebuild -version

      # Archivace bez podpisu. Tři vypínače dělají dohromady to, že Xcode
      # nehledá certifikát ani provisioning profil:
      #   CODE_SIGNING_ALLOWED=NO     — nepodepisuj vůbec
      #   CODE_SIGNING_REQUIRED=NO    — a nestěžuj si, že podpis chybí
      #   CODE_SIGN_IDENTITY=""       — žádná identita k použití
      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      # Nepodepsanou .ipa nejde vyrobit přes `xcodebuild -exportArchive` —
      # ten trvá na podpisu. .ipa je ale jen ZIP se složkou Payload/, takže
      # se .app zabalí ručně. Sideloadly takový balík podepíše samo.
      - name: Package .app into unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "V archivu není žádná .app — build se nepovedl."
            exit 1
          fi
          echo "Balím: $APP_PATH"

          WORK="$RUNNER_TEMP/ipa"
          mkdir -p "$WORK/Payload"
          cp -R "$APP_PATH" "$WORK/Payload/"

          cd "$WORK"
          zip -qry "$RUNNER_TEMP/CalorieTracker-unsigned.ipa" Payload
          echo "Hotovo:"
          ls -lh "$RUNNER_TEMP/CalorieTracker-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-unsigned-ipa
          path: ${{ runner.temp }}/CalorieTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Artifact výš je za přihlášením do GitHubu, takže z něj SideStore
      # stahovat nemůže. Kontrola aktualizací v appce proto čte Releases —
      # jejich přílohy mají veřejnou přímou URL.
      #
      # Když už tag existuje (push do main bez zvýšení APP_VERSION), jen se
      # přepíše příloha. Vytvářet nový release na každý commit by znamenalo
      # desítky releasů se stejnou verzí a uživatel by stejně žádnou
      # aktualizaci nedostal — porovnává se verze, ne počet buildů.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/CalorieTracker-unsigned.ipa"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje — přepisuju .ipa."
            gh release upload "$TAG" "$IPA" --clobber
          else
            echo "Zakládám release $TAG."
            gh release create "$TAG" "$IPA" \
              --title "Calorie Tracker $VERSION" \
              --notes "Nepodepsaná .ipa pro sideloading přes SideStore nebo Sideloadly.

          Appka si tenhle release sama hlídá a nabídne aktualizaci."
          fi

          echo "Přímý odkaz na .ipa:"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name | endswith(".ipa")) | .url'
